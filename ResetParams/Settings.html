<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>計算トレーニング  設定</title>
        <link rel="stylesheet" href="./Settings.css">
        <meta name="viewport" content="width=device-width,initial-scale=1">
    </head>
    <body>
        <script src="./Settings.js"></script>
    <header>
        <h1>計算トレーニング  設定画面</h1>
    </header>
    <main>
        <p>問題数と難易度を<span class="buf">正の整数</span>で入力して下さい.</p>
        <h2 id="tqty">問題数</h2>
            <p>出題する問題の数です.</p>
            <p> <button class="convParam" onclick="setQty(5)">5</button>
                <button class="convParam" onclick="setQty(10)">10</button>
                <button class="convParam" onclick="setQty(20)">20</button>
                <button class="convParam" onclick="setQty(50)">50</button></p>
            <input type="text", id="qty" value="10">
        <h2 id="tdif">難易度</h2>
            <p>数字が大きいほど問題に現れる数が大きくなり, 問題が難しくなりやすくなります.</p>
            <p> <button class="convParam" onclick="setDif(5)">5</button>
                <button class="convParam" onclick="setDif(10)">10</button>
                <button class="convParam" onclick="setDif(20)">20</button>
                <button class="convParam" onclick="setDif(50)">50</button>
                <button class="convParam" onclick="setDif(100)">100</button>
                <button class="convParam" onclick="setDif(200)">200</button>
                <button class="convParam" onclick="setDif(500)">500</button>
                <button class="convParam" onclick="setDif(1000)">1000</button></p>
            <input type="text", id="dif" value="10">

    <footer>
        <button class="play" onclick="Start()">開始する</button></p>
